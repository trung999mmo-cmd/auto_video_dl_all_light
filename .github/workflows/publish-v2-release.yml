name: Publish VideoRecapCutter V2 Release

on:
  workflow_dispatch:
  push:
    branches: [video-recap-cutter]
    paths:
      - '.github/workflows/publish-v2-release.yml'

permissions:
  contents: write

env:
  ARTIFACT_ID: '10094911067'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing V2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip > artifact.zip
          mkdir artifact
          unzip -o artifact.zip -d artifact
          find artifact -maxdepth 3 -type f -printf '%p %k KB\n'

      - name: Locate release ZIP
        id: locate
        shell: bash
        run: |
          ASSET=$(find artifact -type f -name 'VideoRecapCutter-V2-Full.zip' | head -n 1)
          if [ -z "$ASSET" ]; then
            echo 'VideoRecapCutter-V2-Full.zip not found in artifact'
            exit 1
          fi
          cp "$ASSET" ./VideoRecapCutter-V2-Full.zip
          echo "asset=VideoRecapCutter-V2-Full.zip" >> "$GITHUB_OUTPUT"
          sha256sum VideoRecapCutter-V2-Full.zip

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2-latest --cleanup-tag -y || true
          gh release create v2-latest VideoRecapCutter-V2-Full.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "VideoRecapCutter V2 Full" \
            --notes "Bản V2 Full cho Windows: EXE, FFmpeg, Piper runtime, voice mẫu, source và script build."
