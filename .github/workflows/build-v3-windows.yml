name: Build VideoRecapCutter V3 Windows

on:
  push:
    branches: [video-recap-cutter]
    paths:
      - 'app_v3.py'
      - 'app_v2.py'
      - 'recap_core_v2.py'
      - 'voice_clone_worker.py'
      - 'INSTALL-VOICE-CLONE.bat'
      - 'requirements.txt'
      - '.github/workflows/build-v3-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video-recap-cutter

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download FFmpeg essentials
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_unpack -Force
          $bin = Get-ChildItem -Path ffmpeg_unpack -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)\ffmpeg.exe" tools\ffmpeg.exe
          Copy-Item "$($bin.FullName)\ffprobe.exe" tools\ffprobe.exe

      - name: Download Piper Windows runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile piper.zip
          Expand-Archive piper.zip -DestinationPath piper_unpack -Force
          $piperDir = Get-ChildItem -Path piper_unpack -Recurse -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'piper.exe') } | Select-Object -First 1
          if (-not $piperDir) { throw 'Không tìm thấy piper.exe sau khi giải nén' }
          New-Item -ItemType Directory -Force -Path piper_runtime | Out-Null
          Copy-Item "$($piperDir.FullName)\*" piper_runtime -Recurse -Force

      - name: Download bundled Vietnamese Piper voice
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path voice_bundle | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx?download=true" -OutFile "voice_bundle\vi_VN-vais1000-medium.onnx"
          Invoke-WebRequest -Uri "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx.json?download=true" -OutFile "voice_bundle\vi_VN-vais1000-medium.onnx.json"

      - name: Build V3 EXE with full Selenium
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name VideoRecapCutter `
            --add-binary "tools\ffmpeg.exe;." `
            --add-binary "tools\ffprobe.exe;." `
            --collect-all selenium `
            --collect-submodules edge_tts `
            --collect-submodules google.generativeai `
            --hidden-import selenium.webdriver.chrome.options `
            --hidden-import selenium.webdriver.chrome.service `
            --hidden-import selenium.webdriver.common.by `
            --hidden-import selenium.webdriver.common.keys `
            --hidden-import selenium.webdriver.support.ui `
            --hidden-import requests `
            app_v3.py

      - name: Prepare V3 full package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          New-Item -ItemType Directory -Force -Path package\voices | Out-Null
          New-Item -ItemType Directory -Force -Path package\voice_profiles | Out-Null
          New-Item -ItemType Directory -Force -Path package\chrome_web_profile | Out-Null
          New-Item -ItemType Directory -Force -Path package\piper | Out-Null
          New-Item -ItemType Directory -Force -Path package\source | Out-Null

          Copy-Item dist\VideoRecapCutter.exe package\VideoRecapCutter.exe
          Copy-Item tools\ffmpeg.exe package\ffmpeg.exe
          Copy-Item tools\ffprobe.exe package\ffprobe.exe
          Copy-Item piper_runtime\* package\piper -Recurse -Force
          Copy-Item voice_bundle\* package\voices -Force
          if (Test-Path VOICES-README.txt) { Copy-Item VOICES-README.txt package\voices\README.txt }
          Copy-Item INSTALL-VOICE-CLONE.bat package\INSTALL-VOICE-CLONE.bat
          Copy-Item voice_clone_worker.py package\voice_clone_worker.py

          Copy-Item app_v3.py package\source\app_v3.py
          Copy-Item app_v2.py package\source\app_v2.py
          Copy-Item recap_core_v2.py package\source\recap_core_v2.py
          Copy-Item voice_clone_worker.py package\source\voice_clone_worker.py
          Copy-Item requirements.txt package\source\requirements.txt
          Copy-Item .github\workflows\build-v3-windows.yml package\source\build-v3-windows.yml

          @"
          KHO GIỌNG MẪU CỦA BẠN

          Cách 1 - trong tool:
          Bấm 'Thêm 1 giọng mẫu' để chọn WAV/MP3 và đặt tên.

          Cách 2 - nhập VietVoice:
          Bấm 'Nhập thư mục VietVoice' và chọn thư mục data\voice-profiles của VietVoice.
          Tool tự tìm các file reference.mp3/reference.wav và copy vào đây.

          Mỗi giọng được lưu trong một thư mục con, ví dụ:
          voice_profiles\giong-tieng-viet-lan\reference.mp3

          Các giọng trong đây được nhớ vĩnh viễn và tự hiện trong ô 'Giọng đọc'.
          "@ | Out-File -Encoding utf8 package\voice_profiles\README.txt

          @"
          VIDEO RECAP CUTTER V3

          1. Chạy VideoRecapCutter.exe.
          2. Ngôn ngữ đã đổi thành tên tiếng Việt rõ ràng: Tiếng Việt, Tiếng Anh, Tiếng Nhật, Tiếng Hàn, Tiếng Trung... tổng 15 ngôn ngữ.
          3. Không còn bắt buộc hiểu 'Hệ giọng'. Chọn trực tiếp giọng trong ô 'Giọng đọc'.
          4. Muốn chuyển giọng từ VietVoice: trong tool bấm 'Nhập thư mục VietVoice', chọn thư mục data\voice-profiles.
          5. Tool lưu giọng mẫu ở thư mục voice_profiles và nhớ cho lần mở sau.
          6. Chrome Web AI dùng tự động thư mục chrome_web_profile; không cần nhập user-data-dir.
          7. Lần đầu dùng Web AI: bấm 'Mở Gemini / ChatGPT', đăng nhập rồi đóng Chrome đó trước khi bấm chạy.
          8. Đã sửa lỗi đóng gói Selenium: No module named selenium.webdriver.chrome.options.
          9. Nếu dùng giọng mẫu Voice Clone, chạy INSTALL-VOICE-CLONE.bat một lần.
          10. Source đầy đủ nằm trong thư mục source để sau này sửa/build lại.
          "@ | Out-File -Encoding utf8 package\DOC-TRUOC.txt

          @"
          Nếu bạn đã có VietVoice, ví dụ:
          C:\...\Vietvoice_MHCompat_0.2\data\voice-profiles\giong-tieng-viet-lan\reference.mp3

          Không cần copy tay từng file.
          Mở VideoRecapCutter -> phần Giọng đọc -> bấm 'Nhập thư mục VietVoice' -> chọn thư mục:
          C:\...\Vietvoice_MHCompat_0.2\data\voice-profiles

          Tool tự import tất cả thư mục con có reference.mp3/wav.
          "@ | Out-File -Encoding utf8 package\IMPORT-GIONG-TU-VIETVOICE.txt

      - name: Create ZIP
        shell: pwsh
        run: |
          if (Test-Path VideoRecapCutter-V3-Full.zip) { Remove-Item VideoRecapCutter-V3-Full.zip -Force }
          Compress-Archive -Path package\* -DestinationPath VideoRecapCutter-V3-Full.zip -CompressionLevel Optimal
          Get-Item VideoRecapCutter-V3-Full.zip | Format-List Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: VideoRecapCutter-V3-Full
          path: VideoRecapCutter-V3-Full.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish stable V3 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3-latest --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v3-latest --repo "${{ github.repository }}" --cleanup-tag -y
          }
          gh release create v3-latest VideoRecapCutter-V3-Full.zip `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "VideoRecapCutter V3 Full" `
            --notes "V3: giao diện giọng đơn giản, 15 ngôn ngữ tên tiếng Việt, kho voice_profiles nhớ giọng mẫu, import VietVoice, Chrome profile tự động, sửa Selenium đóng gói."
